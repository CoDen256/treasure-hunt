<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin — Break Every Seal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500;1,9..144,600;1,9..144,700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --seal:       #d6a05c;
            --seal-light: #f0c988;
            --seal-deep:  #9c6a34;
            --parchment:  #f4ecdd;
            --muted:      #b2a5c2;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            padding: 40px 24px;
            font-family: 'Fraunces', serif;
        }

        .eyebrow {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: var(--seal);
        }

        /* ── Coins ───────────────────────────────────────────────────── */
        .coin-grid {
            display: grid;
            grid-template-columns: repeat(4, auto);
            gap: 20px;
            align-items: center;
        }

        .coin-slot {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .coin-cut-wrap {
            border-radius: 50%;
            display: inline-block;
        }

        .coin-medal {
            width: 62px; height: 62px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, var(--seal-light), var(--seal-deep));
            display: flex; align-items: center; justify-content: center;
            font-family: 'Fraunces', serif; font-style: italic;
            font-size: 28px; color: #3a2210;
            box-shadow:
                0 4px 18px rgba(214,160,92,0.5),
                0 0 0 4px rgba(214,160,92,0.15),
                0 0 0 6px rgba(214,160,92,0.07);
        }

        /* ── QR row ──────────────────────────────────────────────────── */
        .qr-row {
            display: flex;
            align-items: flex-end;
            gap: 18px;
        }

        .qr-row img {
            display: block;
            border: 1px solid rgba(156,106,52,0.4);
            border-radius: 3px;
        }

        .qr-row img:nth-child(1) { width: 52px;  height: 52px;  }
        .qr-row img:nth-child(2) { width: 68px;  height: 68px;  }
        .qr-row img:nth-child(3) { width: 86px;  height: 86px;  }
        .qr-row img:nth-child(4) { width: 108px; height: 108px; }

        .print-hint {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            letter-spacing: 1.5px;
            color: var(--muted);
            text-align: center;
            opacity: 0.6;
        }

        /* ── Print ───────────────────────────────────────────────────── */
        @media print {
            * {
                print-color-adjust: exact;
                -webkit-print-color-adjust: exact;
            }

            @page {
                size: A4;
                margin: 18mm;
            }

            body {
                background: #ffffff !important;
                min-height: 0;
                padding: 0;
                display: block;
                gap: 0;
            }

            .eyebrow, .print-hint { display: none; }

            /* 4 coins in a row — real coin diameter ~23mm (1€ coin) */
            .coin-grid {
                display: flex;
                flex-direction: row;
                justify-content: center;
                gap: 10mm;
                margin-bottom: 10mm;
            }

            .coin-cut-wrap {
                border: 1.5px dashed rgba(156,106,52,0.5);
                padding: 3mm;
            }

            .coin-medal {
                width: 23mm; height: 23mm;
                font-size: 11mm;
                box-shadow:
                    0 0 0 1.5mm rgba(214,160,92,0.25),
                    0 0 0 2mm   rgba(214,160,92,0.1);
            }

            /* 4 QR codes at different sizes */
            .qr-row {
                display: flex;
                flex-direction: row;
                justify-content: center;
                align-items: flex-end;
                gap: 8mm;
            }

            .qr-row img:nth-child(1) { width: 15mm; height: 15mm; }
            .qr-row img:nth-child(2) { width: 21mm; height: 21mm; }
            .qr-row img:nth-child(3) { width: 29mm; height: 29mm; }
            .qr-row img:nth-child(4) { width: 38mm; height: 38mm; }
        }
    </style>
</head>
<body>

<div class="eyebrow">Printable — real coin size · 4 coins · 4 QR sizes</div>

<div class="coin-grid">
    <div class="coin-slot">
        <div class="coin-cut-wrap"><div class="coin-medal">&amp;</div></div>
    </div>
    <div class="coin-slot">
        <div class="coin-cut-wrap"><div class="coin-medal">&amp;</div></div>
    </div>
    <div class="coin-slot">
        <div class="coin-cut-wrap"><div class="coin-medal">&amp;</div></div>
    </div>
    <div class="coin-slot">
        <div class="coin-cut-wrap"><div class="coin-medal">&amp;</div></div>
    </div>
</div>

<div class="qr-row">
    <img src="qr-code4.png" alt="QR code">
    <img src="qr-code4.png" alt="QR code">
    <img src="qr-code4.png" alt="QR code">
    <img src="qr-code4.png" alt="QR code">
</div>

<p class="print-hint">Ctrl/Cmd + P · disable "Headers and footers" before printing</p>

</body>
</html>
