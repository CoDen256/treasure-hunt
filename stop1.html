<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#17101f">
    <title>Break Every Seal – Stop 01</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600;1,9..144,700&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared.css">
</head>
<body>

<div id="sparkles"></div>

<div id="cel-overlay" class="cel-overlay">
    <div class="cel-seal">&amp;</div>
    <h2 class="cel-title">Every seal broken.</h2>
    <p class="cel-sub" id="cel-sub">You've solved this stop.</p>
    <div id="cel-action"></div>
</div>

<div class="wrap">
    <div class="eyebrow" id="eyebrow-label"></div>
    <h1 class="title" id="page-title"></h1>
    <p class="subtitle" id="page-subtitle"></p>
    <div class="progress-wrap">
        <div class="seal-strand" id="seal-strand"></div>
        <div class="seal-count" id="seal-count">0 / 0</div>
    </div>
    <hr class="divider">
    <div id="sections-container"></div>
    <div id="cel-inline" class="inline-action" style="display:none"></div>
</div>

<script src="shared.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    VerifyPage.init({
        stopLabel:    "STOP 01 — VETERAN PARK",
        pageTitle:    "Verify Your Solutions",
        pageSubtitle: "Enter what you discovered to break the seals.",
        sections: [
            {
                title: "The Challenges",
                note:  "Solve these together — the answers point the way.",
                items: [
                    {
                        type:  'poem',
                        label: "Clue 1 · Riddle",
                        text:  `Seek out the woman who wears no crown,
Yet rules a palace here in town.
Not a castle of stone and moat,
But one where flickering stories float.
Her name means "queen" in a language old,
Her halls are dark, her tales are bold.

Where we sit, we watch, we later debate —
One studio brings us stories of fate,
Its number is twenty, and four the rest,
The strangest, boldest, and often the best.`
                    },
                    {
                        type:  'display',
                        label: "Clue 2 · Anagram",
                        title: "Unscramble This",
                        text:  "A word has been scattered like ash in the wind.\n" +
                               "Piece it back together — the word is not the answer, it is the key. Return to the palace the first riddle named. Carry your unscrambled word — it will guide your eyes once you arrive.\n" +
                               "YESDOSY"
                    }
                ]
            },
            {
                items: [
                    { type: 'text',
                        label: "Where should you go next?",
                        answers: ["REGINA PALAST", "REGINA"],
                        hint: "" },
                    { type: 'text',
                        label: "What should you look for? (Solved key)",
                        answers: ["ODYSSEY"],
                        hint: "" },
                    // Date answer in DD.MM.YYYY — the picker internally uses YYYY-MM-DD but comparison converts automatically
                    { type: 'date',
                        label: "Password (Go to the location and find the password using the key)",
                        answers: ["16.07.2026"],
                        hint: ""},
                    { type: 'photo', label: "Capture This Stop" }
                ]
            }
        ],
        successType: 'popup',
        nextPage:    'stop2.html'
    });
});
</script>
</body>
</html>
