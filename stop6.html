<script src="shared.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    VerifyPage.init({
        stopLabel:   "STOP 06 — [Hauptbahnhof 131 Bus]",
        pageTitle:   "Verify Your Solutions",
        pageSubtitle: "Enter what you discovered to break the seals.",
        sections: [
            {
                title: "Find the Center",
                note:  "Each riddle points to a real place. Each place has a known distance to the target.",
                items: [
                    {
                        type:  'poem',
                        label: "Mystery Place 1 · 129 m",
                        text:  `Where stories sleep and wisdom gleams,
We seek the paths of inner dreams.
Not just for tales, but how to grow,
And games where clever thinkers go.

Our special spot, a cozy space,
Where learning finds its happy place.
For quiet talks, and plans we'd make,
Books for our dates, for goodness sake!`
                    },
                    {
                        type:  'poem',
                        label: "Mystery Place 2 · 354 m",
                        text:  `A woman's name above the door,
Where we had never dined before.
You wore red — a skirt so bright,
I could hardly eat that night.

Wine was poured, our first shared plate,
The place still known — our first true date.
No need to walk there, no need to roam,
Just say her name, and you'll be home.`
                    },
                    {
                        type:  'poem',
                        label: "Mystery Place 3 · 543 m",
                        text:  `A tumble from stone, a twist, a scare,
We rushed to a place with machines and care.
No bones were broken, but still we had to see
What secrets were hidden inside her knee.

A giant magnet hummed its tune,
While pictures formed of bone too soon.
Name the place where they could see —
The hidden truth inside her knee.`
                    }
                ]
            },
            {
                items: [
                    { type: 'text', label: "First date (354m)", answers: ["DONNA"], hint: "" },
                    { type: 'text', label: "Machine (543m)", answers: ["MRT", "MRI", "ZRN Leipzig"], hint: "" },
                    { type: 'text', label: "Cozy space (129m)", answers: ["Thalia"], hint: "" },
                    { type: 'text', label: "Where should you go?",  answers: ["NIKOLAIKIRCHE", "NIKOLAIKIRCHHOF", "BRUNNEN", "FOUNTAIN"], hint: "" },
                    { type: 'text', label: "What should you do there?",  answers: ["LISTEN TO THE COIN"], hint: "" },
                    { type: 'photo', label: "Capture This Stop" }
                ]
            }
        ],
        successType: 'coin',
        nextPage:    'stop7.html'
    });
});
</script>
